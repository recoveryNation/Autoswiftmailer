version: "3.8"
services:
  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env
  web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - api
